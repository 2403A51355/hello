<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Example</title>
</head>
<body style="background-color: #f4f4f9; font-family: Arial, sans-serif; margin: 0; padding: 40px; text-align: center;">

    <!-- Main Heading with background, border radius, padding, and custom color -->
    <h1 style="color: #333333; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block;">
        Welcome to My Page
    </h1>

    <!-- Paragraph with specific font size, color, and line height -->
    <p style="color: #666666; font-size: 18px; line-height: 1.6; max-width: 600px; margin: 20px auto;">
        This paragraph is styled entirely using <strong style="color: #ff5722;">inline CSS</strong>. Each HTML element has its own separate style attribute defining its appearance.
    </p>

    <!-- Styled Call-to-Action Button -->
    <button style="background-color: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">
        Get Started
    </button>

</body>
</html>
